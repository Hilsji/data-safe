[project]
name = "guide-worker"
version = "0.1.0"
description = "Verarbeitungs-Pipeline für Bildschirmaufnahmen – Guide me on the right way."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43",
  "numpy>=1.26",
  "pillow>=10",
]

[project.optional-dependencies]
# Schwere Abhängigkeiten der Pipeline (Docker-Image). Für die Unit-Tests nicht nötig.
pipeline = [
  "faster-whisper>=1.0",
  "paddleocr>=2.8",
  "pymongo>=4.8",
  "httpx>=0.27",
]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["guide_worker"]
